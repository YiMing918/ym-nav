name: 部署包自动刷新

# 发版（Release 发布）时，自动按下面的清单从该标签的代码重打「手机部署包」，
# 并刷新到这个 Release（同名覆盖、旧日期的包会删掉，只留最新一个）。
# 也可以在 Actions 页手动运行：填一个已经存在的 Release 标签，给它补包/刷新包。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Release 标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 确定标签与包名
        id: t
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REL_TAG:-$IN_TAG}"
          if [ -z "$TAG" ]; then echo "::error::没有拿到 Release 标签"; exit 1; fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::标签格式不对：$TAG（应形如 v2.1.4）"; exit 1; fi
          ZIPNAME="ym-nav-deploy-${TAG}-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          WZIPNAME="ym-nav-worker-deploy-${TAG}-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIPNAME" >> "$GITHUB_OUTPUT"
          echo "wzip=$WZIPNAME" >> "$GITHUB_OUTPUT"
          echo "本次处理：$TAG -> $ZIPNAME + $WZIPNAME"

      - name: 拉取该标签的代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - name: 准备 Node（跑测试与头表比对用）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 跑仓库测试（不过不打包）
        run: |
          for f in tests/*.mjs; do node "$f" || exit 1; done

      - name: 按清单打包
        env:
          ZIPNAME: ${{ steps.t.outputs.zip }}
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then echo "::error::清单里的文件不存在：$f"; exit 1; fi
            mkdir -p "stage/$(dirname "$f")"
            cp "$f" "stage/$f"
          done <<'PACKLIST'
          _headers
          functions/_auth.js
          functions/_ssrf.js
          functions/api/click.js
          functions/api/config.js
          functions/api/icon.js
          functions/api/login.js
          functions/api/logout.js
          functions/api/probe.js
          functions/api/setup.js
          functions/api/wallpaper.js
          index.html
          PACKLIST
          find stage -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd stage
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$ZIPNAME" -@
          cd ..
          sha256sum "$ZIPNAME" > SHA256SUMS.txt
          echo "包内文件："
          unzip -Z1 "$ZIPNAME"
          cat SHA256SUMS.txt
          # 直传专用包：控制台拖拽上传不会编译 functions/，故把后端合成单个
          # _worker.js（入口 build/worker-entry.js，原函数源码不改）另打一包。
          # 包根 = _worker.js + 静态文件（原包清单里除 functions/ 外的那些）。

      - name: 比对 _headers 与 worker-entry 头表（漂移即红灯）
        run: |
          cat > /tmp/cmp_headers.mjs <<'EOF'
          import fs from 'node:fs';
          const htxt = fs.readFileSync('_headers', 'utf8');
          const fromFile = {};
          for (const line of htxt.split('\n')) {
            const t = line.trim();
            if (!t || t.startsWith('/') || t.startsWith('#')) continue;
            const i = t.indexOf(':');
            if (i > 0) fromFile[t.slice(0, i).trim().toLowerCase()] = t.slice(i + 1).trim();
          }
          const src = fs.readFileSync('build/worker-entry.js', 'utf8');
          const m = src.match(/const STATIC_HEADERS = \[([\s\S]*?)\];/);
          if (!m) { console.error('STATIC_HEADERS not found'); process.exit(1); }
          const fromCode = {};
          for (const e of m[1].matchAll(/\[\s*'([^']+)'\s*,\s*(?:"([^"]*)"|'([^']*)')\s*\]/g)) {
            fromCode[e[1].toLowerCase()] = (e[2] ?? e[3] ?? '').trim();
          }
          const keys = new Set([...Object.keys(fromFile), ...Object.keys(fromCode)]);
          let bad = 0;
          for (const k of keys) {
            if (fromFile[k] !== fromCode[k]) { console.error(`MISMATCH ${k}: _headers=${JSON.stringify(fromFile[k])} code=${JSON.stringify(fromCode[k])}`); bad++; }
          }
          if (bad) { console.error(`headers drift: ${bad}`); process.exit(1); }
          console.log(`headers in sync (${keys.size} entries)`);
          EOF
          node /tmp/cmp_headers.mjs

      - name: 打包直传专用包（_worker.js 高级模式）
        env:
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          npx -y esbuild@0.25.0 build/worker-entry.js --bundle --format=esm \
            --platform=neutral --target=es2022 --outfile=_worker.js
          rm -rf stage-worker && mkdir stage-worker
          cp _worker.js stage-worker/
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "stage-worker/$(dirname "$f")"
            cp "$f" "stage-worker/$f"
          done <<'STATICLIST'
          _headers
          index.html
          STATICLIST
          find stage-worker -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd stage-worker
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$WZIPNAME" -@
          cd ..
          sha256sum "$WZIPNAME" >> SHA256SUMS.txt
          echo "直传包内文件："
          unzip -Z1 "$WZIPNAME"
          cat SHA256SUMS.txt

      - name: 刷新到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.tag }}
          ZIPNAME: ${{ steps.t.outputs.zip }}
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          gh release delete-asset "$TAG" "SHA256SUMS.txt" -y || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-nav-worker-deploy-.+\.zip$' | grep -vx "$WZIPNAME" | while read -r a; do echo "删除旧直传包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-nav-deploy-.+\.zip$' | grep -vx "$ZIPNAME" | while read -r a; do echo "删除旧普通包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release upload "$TAG" "$ZIPNAME" "$WZIPNAME" SHA256SUMS.txt --clobber
          echo "已刷新到 Release $TAG：$ZIPNAME + $WZIPNAME + SHA256SUMS.txt"
