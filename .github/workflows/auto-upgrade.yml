name: auto-upgrade

# 每周自动试升级（周一 08:50 北京时间）：在锁文件允许的范围内试升工具 esbuild / wrangler，
# 全套测试 + 工具链验证都过才提交（提交后 Pages 连 Git 自动部署上线）；
# 任何一步不过就整次作废，仓库和线上保持原样。这台机器自己也靠下面的心跳文件
# 证明在岗：哪周没留下心跳，就是它自己出故障了，巡检会报出来。
on:
  schedule:
    - cron: '50 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-upgrade-ym-nav
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 试升级依赖（锁文件范围内）
        run: |
          npm update --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: 跑仓库测试（不过不提交）
        run: |
          for f in tests/*.mjs; do node "$f" || exit 1; done
      - name: 验工具链（esbuild / wrangler 能跑）
        run: |
          ./node_modules/.bin/esbuild --version
          ./node_modules/.bin/wrangler --version
      - name: 有升级就提交，没升级就留心跳
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          echo "last auto-upgrade run: $DATE" > .github/auto-upgrade-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          UPGRADED=0
          git diff --quiet -- package.json package-lock.json || UPGRADED=1
          git add package.json package-lock.json .github/auto-upgrade-heartbeat.txt
          if git diff --cached --quiet; then
            echo "没有可提交的改动（依赖没升级、心跳日期也没变），本次正常结束。"
            exit 0
          fi
          if [ "$UPGRADED" = "1" ]; then
            git commit -m "auto-upgrade: 依赖周更 $DATE（测试全过）"
            echo "已提交升级，Pages 连 Git 会自动部署上线。"
          else
            git commit -m "chore: 每周试升级心跳 $DATE [skip ci]"
            echo "本周没有可升级的依赖，已留心跳。"
          fi
          git push
          # GITHUB_TOKEN 推回 main 不会触发 ci（防递归），这里手动把 ci 叫起来，
          # ci 绿了 promote 才会把提交推上 production，正式版才跟得上。
          if ! gh workflow run ci.yml --ref main; then
            echo "::error::触发 ci 失败：升级提交已在 main 上，但 CI 没跑起来，promote 不会动，production 会悄悄落后——请到 Actions 页手动跑一次 ci。"
            echo "❌ 触发 ci 失败，production 会落后，请手动跑一次 ci。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
